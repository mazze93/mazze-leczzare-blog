name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, type-check & build
    runs-on: ubuntu-latest

    steps:
      # Pinned to full commit SHAs rather than @v7. A tag is mutable and can be
      # repointed at arbitrary code after review; a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci`, not `npm install --prefer-offline`. `npm install` is free to
      # resolve a DIFFERENT tree than package-lock.json, so CI was not testing
      # the lockfile that review and deploy actually use. `ci` installs the
      # lockfile exactly and fails loudly if it disagrees with package.json.
      - name: Install (locked)
        run: npm ci

      # The 194-test vitest suite. It existed and passed but nothing ran it,
      # so a logic regression in src/utils could reach main with CI green.
      # Placed before the build so it fails fast on logic, not after a build.
      - name: Test
        run: npm test

      # The Editorial Desk is implemented with browser-native ES modules under
      # public/ and would otherwise escape the Vitest src/** discovery.
      - name: Editorial Desk regression tests
        run: npm run test:editorial

      - name: Type-check + build
        run: npm run check

      # Behavioural check of every on-site carousel against the build above.
      # It existed and nothing ran it, and its full-load-only scenarios missed
      # that strips reached by a second in-site link shipped inert (2026-11-25).
      # Runs on every PR, not only carousel PRs: that bug came from the router,
      # not from the strip. Playwright pinned to the version it was validated on.
      - name: Carousel strip behaviour
        run: |
          python3 -m venv "$RUNNER_TEMP/pw"   # system Python is PEP 668-managed
          PY="$RUNNER_TEMP/pw/bin/python"
          "$PY" -m pip install --quiet playwright==1.65.2
          "$PY" -m playwright install --with-deps chromium
          npx astro preview --port 4321 --host 127.0.0.1 > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:4321/ && break; sleep 1; done
          status=0
          for deck in docs/social/*/slides.json; do
            slug=$(basename "$(dirname "$deck")")
            "$PY" scripts/carousel/strip_check.py "$slug" --out "$RUNNER_TEMP/strip/$slug" || status=1
          done
          exit $status

      - name: Security audit
        run: npm audit --audit-level=high
