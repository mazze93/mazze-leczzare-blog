      <stop offset="0"    stop-color="#FFF1C2" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#F8DC93" stop-opacity="0.85"/>
      <stop offset="0.7"  stop-color="#F3C871" stop-opacity="0.35"/>
      <stop offset="1"    stop-color="#F3C871" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="disc" cx="428" cy="274" r="130" gradientUnits="userSpaceOnUse">
