<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <!-- High-contrast parchment ground -->
  <rect width="1000" height="1000" fill="#FAF5E8" />

  <!-- Borders -->
  <rect x="20" y="20" width="960" height="960" fill="none" stroke="#2C1A0C" stroke-width="2.5" />
  <rect x="27" y="27" width="946" height="946" fill="none" stroke="#2C1A0C" stroke-width="0.8" stroke-dasharray="10,4" />
  <rect x="34" y="34" width="932" height="932" fill="none" stroke="#2C1A0C" stroke-width="0.5" />
  <rect x="40" y="40" width="920" height="920" fill="none" stroke="#2C1A0C" stroke-width="0.4" stroke-dasharray="2,6" />

  <!-- Outer Map Labels -->
  <text x="500" y="16" fill="#2C1A0C" font-family="Georgia, serif" font-size="8" font-weight="bold" letter-spacing="1" text-anchor="middle">NADIR</text>
  <text x="500" y="990" fill="#2C1A0C" font-family="Georgia, serif" font-size="8" font-weight="bold" letter-spacing="1" text-anchor="middle">MERIDIAN</text>
  <text x="968" y="505" fill="#2C1A0C" font-family="Georgia, serif" font-size="8" font-weight="bold" letter-spacing="1" text-anchor="middle" transform="rotate(90 968 505)">90° EAST</text>
  <text x="13" y="505" fill="#2C1A0C" font-family="Georgia, serif" font-size="8" font-weight="bold" letter-spacing="1" text-anchor="middle" transform="rotate(-90 13 505)">90° WEST</text>

  <!-- Layer 2: Blake’s Celestial Nimbus -->
  <!-- Nimbus Orbits -->
  <circle cx="500" cy="420" r="390" fill="none" stroke="#2C1A0C" stroke-width="0.5" stroke-dasharray="1,5" />
  <circle cx="500" cy="420" r="375" fill="none" stroke="#2C1A0C" stroke-width="0.6" stroke-dasharray="8,2,2,2" />
  <circle cx="500" cy="420" r="360" fill="none" stroke="#2C1A0C" stroke-width="0.8" stroke-dasharray="2,5" />
  <circle cx="500" cy="420" r="340" fill="none" stroke="#2C1A0C" stroke-width="1.2" stroke-dasharray="20,6,2,6" />
  <circle cx="500" cy="420" r="260" fill="none" stroke="#2C1A0C" stroke-width="2.2" />
  <circle cx="500" cy="420" r="210" fill="none" stroke="#2C1A0C" stroke-width="0.8" stroke-dasharray="5,3" />
  <circle cx="500" cy="420" r="140" fill="none" stroke="#2C1A0C" stroke-width="0.6" stroke-dasharray="1,2" />
  <circle cx="500" cy="420" r="80" fill="none" stroke="#2C1A0C" stroke-width="1.5" />

  <!-- Astronomic Node Dots -->
  <circle cx="500" cy="60" r="4" fill="#2C1A0C" />
  <circle cx="500" cy="780" r="4" fill="#2C1A0C" />
  <circle cx="140" cy="420" r="4" fill="#2C1A0C" />
  <circle cx="860" cy="420" r="4" fill="#2C1A0C" />
  <circle cx="317" cy="237" r="3" fill="#2C1A0C" />
  <circle cx="683" cy="603" r="3" fill="#2C1A0C" />
  <circle cx="317" cy="603" r="3" fill="#2C1A0C" />
  <circle cx="683" cy="237" r="3" fill="#2C1A0C" />

  <!-- Rays -->
  <g stroke="#2C1A0C" stroke-width="1" stroke-linecap="round">
    <line x1="500" y1="30" x2="500" y2="160" />
    <line x1="500" y1="680" x2="500" y2="970" />
    <line x1="30" y1="420" x2="240" y2="420" />
    <line x1="760" y1="420" x2="970" y2="420" />
    <line x1="100" y1="20" x2="315" y2="235" />
    <line x1="685" y1="605" x2="900" y2="820" />
    <line x1="100" y1="820" x2="315" y2="605" />
    <line x1="685" y1="235" x2="900" y2="20" />
  </g>

  <!-- Layer 3: Geological Contour Lines (Ochre) -->
  <path d="M 40,240 Q 240,310 420,160 T 780,240 T 960,250" fill="none" stroke="#A86824" stroke-width="1.8" stroke-linecap="round" />
  
  <!-- Contours & Text Labels -->
  <path d="M 40,840 C 200,800 360,750 500,750 C 640,750 800,800 960,840" fill="none" stroke="#A86824" stroke-width="0.8" stroke-dasharray="5,3,2,3" stroke-linecap="round" />
  <text x="500" y="753" fill="#A86824" font-family="Georgia, serif" font-size="9" font-style="italic" font-weight="bold" text-anchor="middle">800</text>
  
  <path d="M 55,790 C 205,740 365,700 500,700 C 635,700 795,740 945,790" fill="none" stroke="#A86824" stroke-width="1.3" stroke-linecap="round" />
  
  <path d="M 70,730 C 220,680 370,645 500,645 C 630,645 780,680 930,730" fill="none" stroke="#A86824" stroke-width="0.8" stroke-dasharray="4,3,1,3" stroke-linecap="round" />
  <text x="500" y="648" fill="#A86824" font-family="Georgia, serif" font-size="9" font-style="italic" font-weight="bold" text-anchor="middle">1000</text>
  
  <path d="M 90,675 C 240,625 380,595 500,595 C 620,595 760,625 910,675" fill="none" stroke="#A86824" stroke-width="1.3" stroke-linecap="round" />
  
  <path d="M 110,620 C 250,570 380,540 500,540 C 620,540 750,570 890,620" fill="none" stroke="#A86824" stroke-width="0.8" stroke-dasharray="4,3,1,3" stroke-linecap="round" />
  <text x="500" y="543" fill="#A86824" font-family="Georgia, serif" font-size="9" font-style="italic" font-weight="bold" text-anchor="middle">1200</text>

  <!-- Left/Right Ridgelines -->
  <path d="M 100,470 C 130,340 240,300 320,370 C 370,430 290,540 160,500 Z" fill="none" stroke="#A86824" stroke-width="1.3" />
  <path d="M 130,450 C 150,360 220,330 280,380 C 310,420 270,490 180,470 Z" fill="none" stroke="#A86824" stroke-width="0.8" stroke-dasharray="4,3" />
  <text x="250" y="365" fill="#A86824" font-family="Georgia, serif" font-size="9" font-style="italic" font-weight="bold" text-anchor="middle">1400</text>

  <path d="M 900,470 C 870,340 760,300 680,370 C 630,430 710,540 840,500 Z" fill="none" stroke="#A86824" stroke-width="1.3" />
  <path d="M 870,450 C 850,360 780,330 720,380 C 690,420 730,490 820,470 Z" fill="none" stroke="#A86824" stroke-width="0.8" stroke-dasharray="4,3" />
  <text x="750" y="365" fill="#A86824" font-family="Georgia, serif" font-size="9" font-style="italic" font-weight="bold" text-anchor="middle">1400</text>

  <!-- Layer 4: Seraphic Wing Feathers -->
  <!-- Left Wings -->
  <g fill="none" stroke="#2C1A0C" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 500,450 C 350,400 200,290 90,105 C 165,180 295,290 410,345" stroke-width="3" />
    <path d="M 360,285 C 240,205 130,115 60,5 C 135,90 275,200 380,275" stroke-width="2" />
    <path d="M 320,225 C 240,170 160,95 100,20 C 165,75 260,155 340,215" stroke-width="1.8" />
    <!-- Fine feathered cross-hatching and interior detail -->
    <path d="M 460,415 C 370,375 250,285 155,175 M 430,385 C 340,350 230,265 145,170 M 400,355 C 310,320 205,240 135,150 M 370,325 C 290,290 195,215 125,135 M 340,295 C 260,260 175,190 115,120" stroke-width="0.9" opacity="0.85" />
    <path d="M 450,410 C 375,380 270,305 190,215 M 440,400 C 365,370 260,295 180,205 M 420,380 C 345,350 245,280 170,195 M 390,350 C 320,325 225,260 155,180" stroke-width="0.55" opacity="0.7" />

  <!-- Right Wings -->
    <path d="M 500,450 C 650,400 800,290 910,105 C 835,180 705,290 590,345" stroke-width="3" />
    <path d="M 640,285 C 760,205 870,115 940,5 C 865,90 725,200 620,275" stroke-width="2" />
    <path d="M 680,225 C 760,170 840,95 900,20 C 835,75 740,155 660,215" stroke-width="1.8" />
    <!-- Fine feathered cross-hatching and interior detail -->
    <path d="M 540,415 C 630,375 750,285 845,175 M 570,385 C 660,350 770,265 855,170 M 600,355 C 690,320 795,240 865,150 M 630,325 C 710,290 805,215 875,135 M 660,295 C 740,260 825,190 885,120" stroke-width="0.9" opacity="0.85" />
    <path d="M 550,410 C 625,380 730,305 810,215 M 560,400 C 635,370 740,295 820,205 M 580,380 C 655,350 755,280 830,195 M 610,350 C 680,325 775,260 845,180" stroke-width="0.55" opacity="0.7" />
  </g>

  <!-- Layer 5: The Ascending Visionary -->
  <g fill="none" stroke="#2C1A0C" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body contours -->
    <path d="M 500,750 C 420,670 380,520 440,400 C 470,335 492,280 500,180 C 508,280 530,345 560,400 C 620,520 580,670 500,750 Z" stroke-width="3.2" />
    
    <!-- Internal ascending wave sweeps creating muscular tension -->
    <path d="M 500,720 C 452,640 435,535 475,430 C 488,395 498,350 500,260 M 500,720 C 548,640 565,535 525,430 C 512,395 502,350 500,260" stroke-width="1.8" />
    <path d="M 480,670 C 450,605 445,500 480,420 M 520,670 C 550,605 555,500 520,420" stroke-width="1.1" />

    <!-- Intensive Fine Line Engraved Shading -->
    <path d="M 458,635 C 440,570 445,485 482,415 M 542,635 C 560,570 555,485 518,415" stroke-width="0.8" stroke-dasharray="6,2" opacity="0.85" />
    <path d="M 465,680 C 435,610 445,515 485,455 M 535,680 C 565,610 555,515 515,455" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.85" />
    <path d="M 478,715 C 456,655 458,570 488,500 M 522,715 C 544,655 542,570 512,500" stroke-width="0.65" opacity="0.8" />
  </g>

  <!-- Layer 6: Ground horizon & Subterranean Foundation -->
  <g fill="none" stroke="#2C1A0C" stroke-linecap="round">
    <path d="M 140,810 C 270,740 410,745 500,755 C 590,745 730,740 860,810" stroke-width="3.2" />
    <path d="M 70,845 C 240,775 390,765 500,780 C 610,765 760,775 930,845" stroke-width="3" />
    <path d="M 110,860 C 260,800 400,790 500,805 C 600,790 740,800 890,860" stroke-width="1.8" />
    <path d="M 80,885 C 240,820 390,815 500,825 C 610,815 760,820 920,885" stroke-width="1.2" opacity="0.9" />
    <path d="M 50,910 C 220,845 380,840 500,850 C 620,840 780,845 950,910" stroke-width="0.85" stroke-dasharray="6,3,1,3" opacity="0.85" />
    <path d="M 40,935 C 200,870 370,865 500,875 C 630,865 800,870 960,935" stroke-width="0.85" stroke-dasharray="10,4" opacity="0.8" />
  </g>

  <!-- Layer 7: Scale & Compass -->
  <!-- Compass (N/S/E/W in top left) -->
  <g transform="translate(85, 85)" fill="none" stroke="#2C1A0C" stroke-linecap="round">
    <circle cx="0" cy="0" r="30" stroke-dasharray="1,3.5" stroke-width="0.8" />
    <circle cx="0" cy="0" r="22" stroke-width="0.85" />
    <line x1="0" y1="-38" x2="0" y2="38" stroke-width="0.9" />
    <line x1="-38" y1="0" x2="38" y2="0" stroke-width="0.9" />
    <path d="M 0,-38 L 4,-22 L 22,-22 L 8,-12 L 14,8 L 0,0 L -14,8 L -8,-12 L -22,-22 L -4,-22 Z" stroke-width="0.75" />
    
    <!-- Direction Labels -->
    <g fill="#2C1A0C" stroke="none" font-family="Georgia, serif" font-weight="bold" font-size="9" text-anchor="middle">
      <text x="0" y="-41">N</text>
      <text x="0" y="48">S</text>
      <text x="44" y="3.2">E</text>
      <text x="-45" y="3.2">W</text>
    </g>
  </g>

  <!-- Ground Scale at the bottom center -->
  <g transform="translate(400, 952)" fill="none" stroke="#2C1A0C" stroke-linecap="round">
    <line x1="0" y1="0" x2="200" y2="0" stroke-width="1.8" />
    <line x1="0" y1="-4" x2="0" y2="4" stroke-width="1.8" />
    <line x1="50" y1="-2.5" x2="50" y2="2.5" stroke-width="0.85" />
    <line x1="100" y1="-4" x2="100" y2="4" stroke-width="1.8" />
    <line x1="150" y1="-2.5" x2="150" y2="2.5" stroke-width="0.85" />
    <line x1="200" y1="-4" x2="200" y2="4" stroke-width="1.8" />
    <g fill="#2C1A0C" stroke="none" font-family="Georgia, serif" font-size="7" text-anchor="middle">
      <text x="0" y="-8">0</text>
      <text x="100" y="-8">500 yds</text>
      <text x="200" y="-8">1000</text>
      <text x="100" y="11" font-style="italic" font-weight="bold" font-size="8">Scale of Elevation &amp; Distance</text>
    </g>
  </g>
</svg>
