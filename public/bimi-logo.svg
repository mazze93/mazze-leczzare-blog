<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512"
     role="img" aria-label="Mazze LeCzzare — Compass Mark">
  <title>Mazze LeCzzare</title>

  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="#f0fafa"/>

  <!-- Outer segmented ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#5CCFCF" stroke-width="0.8" opacity="0.6"
          pathLength="100" stroke-dasharray="30 5 17 6 26 5 6 99" stroke-linecap="round"/>

  <!-- Bold accent arc (SW → NW) -->
  <path d="M10.2 73 A46 46 0 0 1 27 10.2" fill="none" stroke="#5CCFCF" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Inner dashed ring -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="#5CCFCF" stroke-width="0.6" opacity="0.5"
          pathLength="100" stroke-dasharray="44 7 30 8 100" stroke-linecap="round"/>

  <!-- Inner glow fill -->
  <circle cx="50" cy="50" r="35" fill="#5CCFCF" opacity="0.07"/>

  <!-- Vertical lens -->
  <path d="M50 18 A68 68 0 0 1 50 82 A68 68 0 0 1 50 18 Z"
        fill="none" stroke="#5CCFCF" stroke-width="1.05"/>

  <!-- Horizontal lens -->
  <path d="M78 50 A68 68 0 0 1 22 50 A68 68 0 0 1 78 50 Z"
        fill="none" stroke="#5CCFCF" stroke-width="1.05"/>

  <!-- Center dot -->
  <circle cx="50" cy="50" r="1.9" fill="#5CCFCF"/>
</svg>
