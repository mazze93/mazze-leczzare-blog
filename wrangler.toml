name = "mazze-leczzare-blog"
compatibility_date = "2026-03-07"

[vars]
CONTACT_FROM_EMAIL = "contact@mazzeleczzare.com"
CONTACT_SUBJECT_PREFIX = "Mazze Contact"

# ── Required secrets ──────────────────────────────────────────────────────────────────
# These must be set via `wrangler secret put <NAME>` or the Cloudflare dashboard.
# They are never stored here. See .dev.vars.example for local dev setup.
#
# ADMIN_PASSWORD          — plain-text password checked by /api/login
# JWT_SECRET              — signs/verifies admin session JWTs (≥32 random chars)
# CONTACT_WEBHOOK_URL     — POST validated contact payloads to your webhook receiver
# INGEST_SECRET           — Bearer token checked by /api/ingest (≥32 random chars)
# GITHUB_INGEST_TOKEN     — fine-grained GitHub PAT, Contents:read+write on
#                           mazze93/mazze-leczzare-blog ONLY — no other scopes,
#                           no other repos. Used by /api/ingest to commit new
#                           content files directly to main.

# ── Optional secrets ──────────────────────────────────────────────────────────────────
# CONTACT_WEBHOOK_AUTH_HEADER — Authorization header value for the webhook receiver

# ── KV namespaces ─────────────────────────────────────────────────────────────────────
# Run to create preview namespaces (one-time, per developer):
#   wrangler kv namespace create --preview "JWT_REVOCATION_LIST"
#   wrangler kv namespace create --preview "SHARE_ANALYTICS"
# Then replace the TODO values below.

[[kv_namespaces]]
binding = "JWT_REVOCATION_LIST"
id = "23e6e64051784dcca764c94409fec2b4"
preview_id = "TODO_run_wrangler_kv_namespace_create_preview"

[[kv_namespaces]]
binding = "SHARE_ANALYTICS"
id = "be4945b2396d4601ba12a645490b3efb"
preview_id = "TODO_run_wrangler_kv_namespace_create_preview"

# ── Rate limiting ────────────────────────────────────────────────────────────────────
# Pages Functions supports [[ratelimits]] as of 2025.
# Create namespaces in the Cloudflare dashboard (Manage > Rate Limiting Namespaces)
# then replace the TODO namespace_id values below.
#
# Suggested limits (enforce in the binding handler, not just here):
#   LOGIN_RATE_LIMIT   —  5 req/min  (brute-force protection)
#   INGEST_RATE_LIMIT  — 5 req/min  (writes to repo via GITHUB_INGEST_TOKEN)
#   CONTACT_RATE_LIMIT — 10 req/min (webhook relay)

[[ratelimits]]
binding = "LOGIN_RATE_LIMIT"
namespace_id = "TODO_create_in_cloudflare_dashboard"

[[ratelimits]]
binding = "INGEST_RATE_LIMIT"
namespace_id = "TODO_create_in_cloudflare_dashboard"

[[ratelimits]]
binding = "CONTACT_RATE_LIMIT"
namespace_id = "TODO_create_in_cloudflare_dashboard"
